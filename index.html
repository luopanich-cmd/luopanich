<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Stock Viewer</title>

<!-- ================= UI STYLE ================= -->
<style>
  :root {
   --shadow-card:    0 10px 30px rgba(0,0,0,.08);
   --shadow-control: 0 6px 16px rgba(0,0,0,.08);
   --shadow-image:   0 4px 12px rgba(0,0,0,.12);
   --shadow-float:   0 12px 36px rgba(0,0,0,.12);
 }
  
  html, body {
  margin: 0;
  padding: 0;

  width: 100%;
  max-width: 100%;
  overflow-x: hidden;   /* 🔴 ตัวนี้คือหัวใจ */

  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f2f2f7;
}
  header{
  padding:
    calc(env(safe-area-inset-top, 0px) + 20px)
    calc(env(safe-area-inset-right, 0px) + 16px)
    18px
    calc(env(safe-area-inset-left, 0px) + 16px);
  font-size:22px;
  font-weight:600;

  /* 🔹 Visual */
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-bottom: 1px solid rgba(255,255,255,.4);

  box-shadow:
    0 8px 28px rgba(0,0,0,.06),
    inset 0 -1px 0 rgba(255,255,255,.35);

  /* 🔹 Position */
  position:sticky;
  top:0;
  z-index:50;

  /* 🔹 Layout (สำคัญ) */
  display:flex;
  justify-content:space-between;
  align-items:center;

  /* 🔴 FIX สำคัญ */
  min-height:110px;     /* รองรับ Search + Filter (STEP 5.2) */  
  box-sizing:border-box;

  transition:
    padding .45s cubic-bezier(.34,1.56,.64,1),
    min-height .35s ease,
    background .3s ease,
    box-shadow .3s ease;
  }

  header.scrolled{
   padding:
    calc(env(safe-area-inset-top, 0px) + 12px)
    calc(env(safe-area-inset-right, 0px) + 16px)
    10px
    calc(env(safe-area-inset-left, 0px) + 16px);
   min-height: 72px;
   background: rgba(255,255,255,.85);
   box-shadow:
     0 12px 36px rgba(0,0,0,.12),
     inset 0 -1px 0 rgba(255,255,255,.5);
 } 

/* ================= SHOP TITLE GLOW ================= */
 .shop-title{
   font-weight:700;
   font-size:22px;
   color:#fff;
   letter-spacing:.3px;
   text-shadow:
     0 0 8px rgba(255,255,255,.6),
     0 0 16px rgba(255,255,255,.35);
 }

/* ================= ADMIN TITLE GLOW ================= */
.admin-title{
  font-weight:700;
  font-size:22px;
  color:#fff;
  letter-spacing:.3px;
  text-shadow:
    0 0 6px rgba(255,255,255,.65),
    0 0 18px rgba(255,255,255,.35);
  margin-left:7px;
}
  
  .badge{
    background:#ff3b30;color:#fff;
    border-radius:12px;padding:2px 8px;
    font-size:12px;
  }
  .container{padding:16px;display:grid;gap:16px;}
  
  .card{
    background: rgba(255,255,255,.72);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border-radius:18px;
  padding:14px;
  cursor:pointer;
  box-shadow: var(--shadow-card);
  }
  .name{
  font-weight:600;
  line-height:1.35;

  display:-webkit-box;
  -webkit-line-clamp:2;      /* จำกัด 2 บรรทัด */
  -webkit-box-orient:vertical;

  overflow:hidden;
  word-break:break-word;
}
  .price{color:#007aff;margin-top:4px;}
  .stock{font-size:14px;color:#666;}

  .backdrop{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.25);
  backdrop-filter: blur(2px);
  display: none;
  z-index: 100;
}

.sheet{
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;

  background: rgba(255,255,255,.85);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border-radius: 22px 22px 0 0;
  box-shadow: var(--shadow-float);

  padding: 20px 20px 24px; /* เว้นล่างให้หายอึดอัด */

  /* ✅ CORE FIX */
  max-height: calc(100dvh - 40px);   /* ใช้ dvh แทน vh */
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;

  transform: translateY(100%);
  transition: transform .35s cubic-bezier(.22,.61,.36,1);

  z-index: 101;
}

.sheet.show{
  transform: translateY(0);
}

.sheet h3{
  margin:0 0 12px;
}



/* ================= BASE INPUT (NEUTRAL) ================= */
input,
select {
  width: 100%;
  box-sizing: border-box;
  outline: none;
  font-family: inherit;
  background: rgba(255,255,255,.9);
  color: #111;                 /* 🔴 FIX: text มองเห็นชัดใน light mode */
}

/* 🔴 NEW: textarea base style (Light mode fix) */
textarea {
  width: 100%;
  box-sizing: border-box;
  font-family: inherit;
  background: #fff;
  color: #111;
  border: 1px solid #ddd;
  border-radius: 12px;
}
  
input::placeholder,
textarea::placeholder {
  color: #999;                 /* 🔴 FIX: placeholder ไม่จางเกินไป */
}  

input:focus,
select:focus {
  border-color: #007aff;
}

/* ================= STEP 3: FORM CONSISTENT ================= */

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.form-group label {
  font-size: 13px;
  color: #666;
}

/* ================= FORM INPUT (UNIFIED) ================= */

/* ทุก input / select ใน form + กัน iOS zoom */
.form-group input,
.form-group select {
  width: 100%;
  height: 44px;
  padding: 10px 12px;

  font-size: 16px;          /* 🔴 FIX iOS ZOOM */
  line-height: 1.2;

  border-radius: 12px;
  border: 1px solid #ddd;
  box-sizing: border-box;
  background: #fff;
  font-family: inherit;
}

/* number ต้องเหมือน text (iOS / Android) */
.form-group input[type="number"] {
  appearance: textfield;
  -moz-appearance: textfield;
}

/* focus state */
.form-group input:focus,
.form-group select:focus {
  border-color: #007aff;
  outline: none;
}

  /* ✅ เพิ่มตรงนี้ */
button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

 .btn-remove{
  padding:6px 12px;
  border-radius:10px;
  background:#ff3b30;
  color:#fff;
  border:none;

  font-size:13px;
  font-weight:600;
  line-height:1;

  cursor:pointer;
 }
  /* ✅ เพิ่มตรงนี้ */
.btn-remove:active {
  transform: scale(0.95);
}

/* interaction */
.btn-danger:active,
.btn-outline:active {
  transform: scale(0.97);
}
  
/* ================= BUTTON SYSTEM ================= */

.btn {
  padding: 12px;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  font-size: 15px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition:
    transform .18s cubic-bezier(.34,1.56,.64,1),
    box-shadow .18s ease;
}

/* Primary */
.btn-primary {
  background: #007aff;
  color: #fff;
}

/* Secondary (soft green) */
.btn-secondary {
  background: #34c759;
  color: #fff;
}

/* Outline (cancel / back) */
.btn-outline {
  background: #f2f2f7;
  color: #333;
  border: 1px solid #ddd;
}

/* Interaction */
.btn:active {
  transform: scale(0.94);
}

  .cart-item{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  padding:12px 0;
  border-bottom:1px dashed rgba(0,0,0,.08);
  }

 .cart-item > div:first-child {
   flex: 1;
   min-width: 0; /* 🔴 สำคัญมาก: ให้ text ถูกตัดได้ */
 }

 .cart-item > div:last-child {
   flex-shrink: 0;
   text-align: right;
 }

 .cart-item .price{
   margin-top:2px;
 }

 .cart-item-right{
   display:flex;
   align-items:center;   /* 🔴 หัวใจ: align กับราคา */
   gap:8px;
 }
 

  .total{
  font-size:18px;
  font-weight:700;
  text-align:right;
  margin-top:16px;
  padding-top:12px;
  border-top:1px solid rgba(0,0,0,.08);
  }

#cartSheet .btn-primary{
  margin-top:16px;
  margin-bottom:12px;
}

#cartSheet{
  padding-bottom: calc(env(safe-area-inset-bottom) + 28px);
}
  
  /* ===== Order Preview (Hidden) ===== */
  #orderPreview {
    width: 360px;
    padding: 16px;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: none;
  }
  #orderPreview h2 {
    margin: 0 0 8px;
  }
  #orderPreview .item {
    display:flex;
    justify-content:space-between;
    margin-bottom:6px;
    font-size:14px;
  }
  #orderPreview .footer {
    margin-top:12px;
    font-weight:700;
    text-align:right;
  }

/* ================= HEADER SEARCH (iOS-LIKE) ================= */
.viewer-search-wrap{
   margin-top:6px;
   max-width:calc(100% - 44px);
 }  

.search-wrap {
  display: flex;
  align-items: center;
  position: relative;
  max-width: calc(100% - 44px);
}

.search-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,.6);
  backdrop-filter: blur(10px);
  font-size: 18px;
  cursor: pointer;

  transition:
    transform .18s cubic-bezier(.25,.46,.45,.94),
    background .2s ease;
}

.search-btn:active {
  transform: scale(.92);
}

.search-input {
   width: 260px;
   opacity: 0;
   margin-left: 8px;
   height: 40px;
   padding: 8px 12px;

   font-size: 16px;
   border-radius: 12px;
   border: 1px solid rgba(0,0,0,.12);

   background: rgba(255,255,255,.85);
   color: #111;    /* ✅ อ่านชัดใน light mode */
   backdrop-filter: blur(14px);

  pointer-events: none;

  transform: translateX(-6px) scaleX(.6);
  transform-origin: left center;

  transition:
    opacity .18s ease,
    transform .45s cubic-bezier(.34,1.56,.64,1);
}

/* 🔥 ACTIVE STATE */
.search-wrap.active .search-input {
  opacity: 1;
  transform: translateX(0) scaleX(1);
  pointer-events: auto;
}

/* 🔹 subtle focus glow (iOS feel) */
.search-input:focus {
  border-color: #007aff;
  box-shadow:
    0 0 0 3px rgba(0,122,255,.18);
  outline: none;
}

 /* ================= FILTER ICON DROPDOWN ================= */
 .filter-wrap{ position:relative; }

 .filter-btn{
   width:40px;
   height:40px;
   border-radius:50%;
   border:none;
   background:rgba(255,255,255,.6);
   backdrop-filter:blur(12px);
   font-size:18px;
   cursor:pointer;
 }

 .filter-dropdown{
   position:absolute;
   top:52px;
   right:0;
   min-width:200px;
   padding:10px;
   border-radius:18px;
   background:rgba(255,255,255,.85);
   backdrop-filter:blur(24px);
   box-shadow:var(--shadow-float);
   display:none;
   flex-direction:column;
   gap:6px;
 }

 .filter-dropdown.show{ display:flex; }

 .filter-item{
   padding:8px 12px;
   border-radius:12px;
   font-size:14px;
   cursor:pointer;
 }
  
/* ================= HEADER MENU BUTTON (iOS TACTILE) ================= */
.menu-btn{
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:transparent;
  font-size:26px;
  color:#ffffff; /* 🔴 ทำให้สามขีดเป็นสีขาว */
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:
    transform .18s cubic-bezier(.25,.46,.45,.94),
    background .2s ease;

  -webkit-tap-highlight-color: transparent;
}

.menu-btn:active{
  transform: scale(.92);
  background: rgba(0,0,0,.08);
}

@media (hover:hover){
  .menu-btn:hover{
    background: rgba(0,0,0,.06);
  }
}
  

  /* ================= PRODUCT CARD (HORIZONTAL) ================= */
.product-card {
  display: flex;
  gap: 12px;
  background: rgba(255,255,255,.72);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border-radius: 16px;
  padding: 12px;
  box-shadow: var(--shadow-card);
  align-items: center;
  cursor: pointer;
  transition:
    transform .25s cubic-bezier(.34,1.56,.64,1),
    box-shadow .25s ease;
}

@media (hover:hover){
  .product-card:hover{
    transform: translateY(-4px);
    box-shadow: var(--shadow-float);
  }
}  

.product-card .thumb {
  width: 80px;
  height: 80px;
  border-radius: 12px;
  object-fit: cover;
  background: #f0f0f0;
  flex-shrink: 0;
}

.product-card .info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.product-card .name {
  font-weight: 600;
  font-size: 16px;
}

.product-card .sku {
  font-size: 12px;
  color: #888;
}

.product-card .price {
  color: #007aff;
  font-weight: 600;
  margin-top: 2px;
}

.product-card .meta {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 13px;
  color: #555;
}

.product-card:active {
  transform: scale(0.965);
  box-shadow:
    0 4px 14px rgba(0,0,0,.08);
}  

 .product-info-images {
   display: flex;
   gap: 8px;
   overflow-x: auto;
   margin: 12px 0;
 }

 .product-info-zoom{
   cursor: zoom-in;
 }
 
 .product-info-images img {
   height: 120px;
   border-radius: 12px;
   object-fit: cover;
 }

 .product-info-block {
   background: rgba(255,255,255,.65);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
   border-radius: 12px;
   padding: 12px;
   font-size: 14px;
 }
  
.sheet-product {
  min-height: 60dvh;   /* 🔴 ปรับได้: 65–80 */
}  

/* ===== Status Badge (Viewer) ===== */
.status {
  padding: 3px 10px;
  min-height: 22px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* พร้อมส่ง */
.status.ready {
  background: rgba(52,199,89,.15);
  color: #34c759;
}

/* อยู่ระหว่างจัดส่ง */
.status.shipping {
  background: rgba(0,122,255,.15);
  color: #007aff;
}

/* อยู่โกดังไทย */
.status.warehouse {
  background: #eef3ff;
  color: #3b6cff;
}

/* หมด */
.status.out {
  background: rgba(255,59,48,.15);
  color: #ff3b30;
}


.admin-action {
  display: flex;
  gap: 12px;
  margin-top: 16px;
}

.btn-approve {
  flex: 1;
  background: #007aff;
  color: #fff;
}

.btn-reject {
  flex: 1;
  background: #ff3b30;
  color: #fff;
}

.btn-approve:active,
.btn-reject:active {
  transform: scale(0.97);
}

/* ================= SIDE ADMIN MENU ================= */
.side-menu {
  position: fixed;
  top: 0;
  right: 0;

  width: min(65vw, 260px);
   /* ✅ ลดลงอีกนิด กำลังพอดี */
  height: 100vh;

  background: rgba(255,255,255,.82);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: -6px 0 20px rgba(0,0,0,.12);

  z-index: 102;
  padding: 16px;            /* ✅ ลด padding ให้ดูไม่อึดอัด */

  transform: translateX(100%);
  transition: transform .28s ease;
  will-change: transform;
}

.side-menu.show {
  transform: translateX(0);
}

/* ===== UI DETAILS ===== */
.side-menu h3 {
  margin-top: 0;
  margin-bottom: 16px;
}

.side-menu .menu-btn {
  width: 100%;
  margin-bottom: 12px;
}

.loading {
  text-align: center;
  padding: 32px 16px;
  color: #666;
  font-size: 14px;
}

.loading::after {
  content: "…";
  animation: dots 1.4s infinite;
}

@keyframes dots {
  0%   { content: ""; }
  33%  { content: "."; }
  66%  { content: ".."; }
  100% { content: "..."; }
}

.menu-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-group.danger {
  margin-top: 12px;
}

.btn-danger:active {
  transform: scale(0.97);
}

/* 🔒 iOS SAFARI ZOOM FIX */
input,
select,
textarea {
  font-size: 16px !important; /* 🔴 สำคัญที่สุด */
} 

/* ===== STOCK TIMELINE COLOR TAG ===== */
.timeline-tag {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
}

/* สีตามประเภท */
.tag-in {
  background: #e6f9f0;
  color: #1e9c6a;
}

.tag-out {
  background: #fdecec;
  color: #d93025;
}

.tag-create {
  background: #eef3ff;
  color: #3b6cff;
}

.tag-adjust {
  background: #fff4e5;
  color: #e37400;
}

.tag-cancel {
  background: #f1f1f1;
  color: #666;
}

/* ===== ADMIN LOGIN TWEAK ===== */
#adminLoginSheet {
  padding-bottom: calc(env(safe-area-inset-bottom) + 24px); /* 🔴 ยกขึ้นจากขอบ */
}

/* ===== PREMIUM INPUT STYLE ===== */
.form-group input,
.form-group select,
#adminLoginSheet input,
#adminLoginSheet select {
  background: #f9f9fb;
  border: 1px solid #e5e5ea;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.04);
  color: #111; /* 🔴 FIX: บังคับ text ให้มองเห็นแน่นอน */
}

.form-group input:focus,
#adminLoginSheet input:focus {
  background: #fff;
  border-color: #007aff;
  box-shadow:
    0 0 0 2px rgba(0,122,255,.15),
    inset 0 1px 2px rgba(0,0,0,.04);
} 

/* ================= TOAST SYSTEM (GLOBAL FEEDBACK) ================= */

#toast-container {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 24px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 3000;

  display: flex;
  flex-direction: column;
  gap: 8px;

  pointer-events: none; /* 🔒 ไม่บัง interaction */
}

.toast {
  min-width: 260px;
  max-width: 90vw;
  padding: 12px 16px;

  border-radius: 14px;
  color: #fff;
  font-size: 14px;
  font-weight: 500;

  box-shadow: var(--shadow-float);              /* 🔴 ใช้ token เดียวกับระบบ */

  backdrop-filter: blur(18px) saturate(160%);   /* 🔴 เพิ่ม glass */
  -webkit-backdrop-filter: blur(18px) saturate(160%);

  animation: toast-slide-down .25s ease;
}

/* ===== Toast Variants ===== */
.toast.success { background: rgba(52,199,89,.92); }
.toast.error   { background: rgba(255,59,48,.92); }
.toast.warning { background: rgba(255,159,10,.92); }
.toast.info    { background: rgba(0,122,255,.92); }

/* ===== Animation (namespaced) ===== */
@keyframes toast-slide-down {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hidden {
  display: none;
}

#loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

#loading-overlay.hidden {
  display: none !important;
}

.loading-box {
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  padding: 20px 24px;
  border-radius: 12px;
  box-shadow: var(--shadow-float);
  text-align: center;
  min-width: 200px;
}

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid #ddd;
  border-top-color: #555;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 12px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

 /* ================= QTY INPUT (CART / ADD TO CART) ================= */

 /* wrapper เฉพาะช่องจำนวน */
 .qty-input {
   position: relative;
 }

 /* input number สำหรับจำนวน */
 .qty-input input[type="number"] {
   height: 52px;                    /* สูงขึ้น → ดูเป็น control */
   padding: 12px 44px;              /* เผื่อพื้นที่ icon */
   text-align: center;              /* จำนวนต้องอยู่กลาง */

   font-size: 18px;
   font-weight: 600;

   border-radius: 16px;
   border: 1px solid rgba(0,0,0,.08);

   background: rgba(255,255,255,.9);

<script>
/* ================= STEP 2: ประกาศ backdrop (UPGRADED) ================= */
const backdrop = document.getElementById("globalBackdrop");
const cartSheet = document.getElementById("cartSheet");
  
// ✅ SINGLE SOURCE OF TRUTH: sheet refs (กัน ReferenceError + กันพึ่ง global id)
const productSheet = document.getElementById("productSheet");
const qtySheet = document.getElementById("qtySheet");
const confirmSheet = document.getElementById("confirmSheet");
const stockSheet = document.getElementById("stockSheet");
const adminLoginSheet = document.getElementById("adminLoginSheet");
const adminDashboardSheet = document.getElementById("adminDashboardSheet");
const adminOrderSheet = document.getElementById("adminOrderSheet");
const adminStockSheet = document.getElementById("adminStockSheet");
const adminMenuSheet = document.getElementById("adminMenuSheet");
const adminProductActionSheet = document.getElementById("adminProductActionSheet");
const adminProductEditSheet = document.getElementById("adminProductEditSheet");
const adminStockActionSheet = document.getElementById("adminStockActionSheet");
const adminAddProductSheet = document.getElementById("adminAddProductSheet");

// ✅ expose for inline onclick handlers (ปลอดภัยสุด)
Object.assign(window, {
  productSheet,
  qtySheet,
  confirmSheet,
  stockSheet,
  adminLoginSheet,
  adminDashboardSheet,
  adminOrderSheet,
  adminStockSheet,
  adminMenuSheet,
  adminProductActionSheet,
  adminProductEditSheet,
  adminStockActionSheet,
  adminAddProductSheet
});

// 🔒 ใช้ state.ui.backdropLocked เป็นตัวเดียว (single source of truth)
let allowOpenOrders = false;

  
/* ================= GLOBAL STATE (UPGRADED / SAFE) ================= */

const state = {
  mode: "viewer",
  viewerFilter: {
    status: "all"
  },
  search: "",
  viewerSearchOpen: false,
  products: [],
  selectedProduct: null,
  qty: 1,
  cart: [],
  lastOrder: null,

  // 🔒 viewer submit guard (ใช้กับ createOrder)
  isSubmitting: false,

  admin: {
    loggedIn: false,
    user: null,
    token: null,
    orders: [],
    selectedOrder: null,
    logs: [],

    // 🔒 admin submit guard
    isSubmitting: false
  },

  // 🧠 SMART ADD PRODUCT DRAFT
  smartAddDraft: {
    price: "",
    stock: "",
    status: "ready",
    note: ""
  },

  ui: {
    overlayCount: 0,
    backdropLocked: false
  }
};

/* ================= CART STORAGE (VIEWER ONLY) ================= */

const CART_KEY = "luopanich_cart";

function saveCart() {
  try {
    localStorage.setItem(CART_KEY, JSON.stringify(state.cart));
  } catch (e) {
    console.warn("saveCart failed", e);
  }
}

function loadCart() {
  try {
    const raw = localStorage.getItem(CART_KEY);
    if (!raw) return;

    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) {
      state.cart = parsed;
    }
  } catch (e) {
    console.warn("loadCart failed", e);
  }
}

function clearCartStorage() {
  localStorage.removeItem(CART_KEY);
}  
  
  /* ===== Feedback & Loading Utilities ===== */
function updateLoadingText(message){
  const text = document.getElementById("loading-text");
  if (text) {
    text.textContent = message;
  }
}

function showToast(message, type = 'info', timeout = 2500) {
  const container = document.getElementById('toast-container');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;

  container.appendChild(toast);

  // 🔒 limit toast count (optional but pro)
  if (container.children.length > 3) {
    container.removeChild(container.firstChild);
  }

  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, timeout);
}

// ---------- Central loading timer ----------
let _loadingTimer = null;
let _loadingShownAt = 0;
const MIN_LOADING_MS = 350; // กันกระพริบ

function showLoading(message, timeoutMs = 60000) {
  const overlay = document.getElementById("loading-overlay");
  const text = document.getElementById("loading-text");
  if (!overlay || !text) return;

  text.textContent = message;
  overlay.classList.remove("hidden");

  // บังคับ render
  overlay.offsetHeight;

  _loadingShownAt = Date.now();

  state.isSubmitting = true;
  state.ui.backdropLocked = true;
  if (backdrop) backdrop.style.display = "block";

  clearTimeout(_loadingTimer);
  _loadingTimer = setTimeout(() => {
    console.warn("[showLoading] auto-hide after timeout");
    safeHideLoading(true);
    showToast("การเชื่อมต่อล่าช้า ระบบยกเลิกแล้ว", "warning", 1800);
  }, timeoutMs);
}

/* ================= SAFE HIDE LOADING (SINGLE SOURCE OF TRUTH) ================= */
/**
 * ❗ IMPORTANT
 * - ต้องมี safeHideLoading แค่ตัวเดียวในระบบ
 * - ตัวนี้คือเวอร์ชันเดียวที่อนุญาตให้ใช้
 */

function safeHideLoading(fromTimeout = false) {
  const overlay = document.getElementById("loading-overlay");

  const elapsed = Date.now() - (_loadingShownAt || 0);
  const delay = Math.max(0, MIN_LOADING_MS - elapsed);

  setTimeout(() => {
    try {
      if (overlay) overlay.classList.add("hidden");

      // 🔥 หัวใจ: เคลียร์ timer ของ showLoading
      if (_loadingTimer) {
        clearTimeout(_loadingTimer);
        _loadingTimer = null;
      }

      state.isSubmitting = false;
      // 🔒 ปลด lock เฉพาะเมื่อไม่มี overlay เปิดอยู่ (กัน confirm/flow หลุด)
      if (state.ui.overlayCount === 0) {
        state.ui.backdropLocked = false;
      }

      if (state.ui.overlayCount === 0 && backdrop) {
        backdrop.style.display = "none";
      }

      console.log(
        "[safeHideLoading] loading closed",
        fromTimeout ? "(timeout)" : ""
      );

    } catch (e) {
      console.error("[safeHideLoading] failed", e);
    }
  }, delay);
}


// ---------- fetchWithTimeout ----------
async function fetchWithTimeout(input, init = {}, ms = 30000) {
  const controller = new AbortController();
  const signal = controller.signal;
  const id = setTimeout(() => controller.abort(), ms);

  try {
    const res = await fetch(input, { ...init, signal });

    // 🔒 เช็ค HTTP status ชัดเจน
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`HTTP ${res.status}: ${text}`);
    }

    return res;

  } catch (err) {
    if (err.name === "AbortError") {
      throw new Error("การเชื่อมต่อช้าเกินไป กรุณาลองใหม่อีกครั้ง");
    }
    throw err;
  } finally {
    clearTimeout(id);
  }
}
  

/* ================= API LAYER ================= */
const API_URL="https://script.google.com/macros/s/AKfycbzwRXCVX01CSHievxI7NKITMpf2JCYy6VPAZJ9QiGXRf7dgJ4qDHAGqkFnbInUhQNegMw/exec";

const fetchProducts = async () => {
  const res = await fetchWithTimeout(
   `${API_URL}?action=products`,
   {},
   15000
 );
  const json = await res.json();

  // 🔒 enforce standard response
  if (!json || json.success !== true || !Array.isArray(json.data)) {
    console.error("fetchProducts invalid response:", json);
    return []; // ✅ คืน array เสมอ
  }

  return json.data;
};

function sortProducts(products) {
  if (!Array.isArray(products)) return [];

  return products.sort((a, b) =>
    String(a.productId || "").localeCompare(
      String(b.productId || ""),
      'th',
      {
        numeric: true,
        sensitivity: 'base'
      }
    )
  );
}
  
async function refreshProducts() {
  const list = await fetchProducts();

  state.products = sortProducts(list); // ✅ เพิ่มบรรทัดเดียว
  renderProducts();
}

async function createOrder() {
  // 🔴 HARDENING: reload stock snapshot before submit
  const latestProducts = await fetchProducts();

  for (const item of state.cart) {
    const product = latestProducts.find(
      p => p.productId === item.productId
    );

    if (!product) {
      throw new Error(`ไม่พบสินค้า ${item.name}`);
    }

    if (Number(product.stock) < Number(item.qty)) {
      throw new Error(
        `${item.name} คงเหลือ ${product.stock} ชิ้น (คุณเลือก ${item.qty})`
      );
    }
  }

  const total = state.cart.reduce(
   (s,i)=> s + Number(i.price) * Number(i.qty),
   0
 );

  const form = new URLSearchParams();
  form.append("action", "createOrder");
  form.append("items", JSON.stringify(state.cart));
  form.append("total", total);

  // ใช้ fetchWithTimeout เพื่อป้องกัน request แขวน
  const res = await fetchWithTimeout(API_URL, {
    method: "POST",
    body: form
  }, 15000);

  // 🔴 FIX: เช็ค HTTP status ก่อน
  if (!res.ok) {
    const text = await res.text();
    throw new Error(
      `CreateOrder HTTP ${res.status}: ${text}`
    );
  }

  const json = await res.json();

  // 🔴 FIX: validate response shape
  if (!json || json.success !== true || !json.data?.orderId) {
    throw new Error("Invalid createOrder response");
  }

  return json;
}

function openOverlay(el){
  if (!el || el.classList.contains("show")) return;

  el.classList.add("show");
  state.ui.overlayCount++;

  backdrop.style.display = "block";
}

function closeOverlay(el){
  if (!el || !el.classList.contains("show")) return;

  el.classList.remove("show");
  state.ui.overlayCount = Math.max(0, state.ui.overlayCount - 1);

  if (state.ui.overlayCount === 0 && !state.ui.backdropLocked) {
    backdrop.style.display = "none";

    // 🔴 FIX: reset floating bar momentum state
    const bar = document.getElementById("floatingBar");
    if (bar) bar.classList.remove("scroll-hide");
  }
}

async function adminStockIn(productId, qty, reason){
  if (!state.admin.token) {
    throw new Error("Not authenticated");
  }

  const form = new URLSearchParams();
  form.append("action", "stockIn");
  form.append("productId", productId);
  form.append("qty", qty);
  form.append("reason", reason || "");
  form.append("token", state.admin.token); // ✅ สำคัญที่สุด

  const res = await fetch(API_URL, {
    method: "POST",
    body: form
  });

  const json = await res.json();

  // 🔒 session หมดอายุ / token ผิด
  if (json.error || json.success === false) {
    if (
      json.error === "Session expired" ||
      json.error === "Invalid token" ||
      json.error === "Missing token"
    ) {
      alert("Session หมดอายุ กรุณา login ใหม่");
      exitAdmin();
    }
    throw new Error(json.error || "Stock IN failed");
  }

async function checkStockBeforeSubmit() {
  const latestProducts = await fetchProducts();

  for (const item of state.cart) {
    const product = latestProducts.find(
      p => p.productId === item.productId
    );

    if (!product) {
      return { ok:false, message:`ไม่พบสินค้า ${item.name}` };
    }

    if (Number(product.stock) < Number(item.qty)) {
      return {
        ok:false,
        message:`${item.name} คงเหลือ ${product.stock} ชิ้น (คุณเลือก ${item.qty})`
      };
    }
  }

  return { ok:true };
}

  bar.classList.remove("scroll-hide"); // 🔴 FIX

  /* ===== First Appear Bounce ===== */
  if (!wasVisible){
    bar.classList.remove("bounce-in");
    bar.classList.add("bounce-in");
    setTimeout(()=>{
      bar.classList.remove("bounce-in");

  /* ===== Total Change Animation ===== */
 const totalEl = document.getElementById("floatingTotal");
 if (totalEl){
   const prev = bar.dataset.prevTotal;

     bar.dataset.prevTotal = String(total);

     void totalEl.offsetWidth;
     totalEl.classList.add("total-animate");
    }

/* 🔍 viewer search toggle (เฉพาะ UI) */
function toggleViewerSearch(){
  const wrap  = document.getElementById("viewerSearchWrap");
  const input = document.getElementById("viewerSearchInput");
  if(!wrap || !input) return;

  const opened = wrap.classList.contains("active");

  if(opened){
    input.value = "";
    state.search = "";
    state.viewerSearchOpen = false;
    renderProducts();
    wrap.classList.remove("active");
  }else{
    state.viewerSearchOpen = true;
    wrap.classList.add("active");
    setTimeout(()=>input.focus(),80);
  }
}

/* 🔍 admin search toggle (ICON EXPAND) */

function toggleAdminSearch(){
  const wrap = document.getElementById("adminSearchWrap");
  if (!wrap) return;

  const opening = !wrap.classList.contains("active");

  wrap.classList.toggle("active");

  if (opening) {
    const input = wrap.querySelector("input");
    // 🕒 รอ animation เริ่มก่อน focus (iOS trick)
    setTimeout(() => input && input.focus(), 120);
  }
}

async function handleAdminLogin(btn){
  // 🔒 กันกดซ้ำ
  if (state.isSubmitting) return;

  // 🔒 force global rate limit (scope-safe)
  if (typeof window.isLoginRateLimited === "function") {
    if (window.isLoginRateLimited()) {
      alert("พยายามเข้าสู่ระบบบ่อยเกินไป กรุณารอสักครู่");
      return;
    }
  }

  const userInput = document.getElementById("adminUser");
  const passInput = document.getElementById("adminPass");
  const cancelBtn = document.getElementById("adminCancelBtn");

  const username = userInput.value.trim();
  const password = passInput.value;

  if (!username || !password) {
    alert("กรุณากรอก Username และ Password");
    return;
  }

  // ================= UX START =================
  state.isSubmitting = true;

  if (btn) {
    btn.disabled = true;
    btn.textContent = "กำลังเข้าสู่ระบบ...";
  }
  if (cancelBtn) cancelBtn.disabled = true;

  showLoading("กำลังเข้าสู่ระบบแอดมิน...");
  // ================= UX END ===================

  try {
    // 🔐 CALL BACKEND LOGIN
    const form = new URLSearchParams();
    form.append("action", "adminLogin");
    form.append("username", username);
    form.append("password", password);

    const res = await fetch(API_URL, {
      method: "POST",
      body: form
    });

    const json = await res.json();

    if (!json.success || !json.token) {
      throw new Error(json.error || json.message || "Login failed");
    }

    // ✅ SAVE SESSION (STATE)
    state.admin.loggedIn = true;
    state.admin.user = json.username;
    state.admin.token = json.token;
    state.admin.expiredAt = json.expiredAt;

    // ✅ SAVE SESSION (PERSIST)
    saveAdminSession(json);

    // 🧹 CLOSE LOGIN SHEET
    closeOverlay(adminLoginSheet);

    // 🔓 reset lock เผื่อมีค้าง
    state.ui.backdropLocked = false;

    // 🚀 ENTER ADMIN MODE
    enterAdmin();

  } catch (err) {
    console.error(err);
    alert(err.message || "ไม่สามารถเข้าสู่ระบบได้");

  } finally {
    // ================= CLEANUP =================
    safeHideLoading();
    state.isSubmitting = false;

    if (btn) {
      btn.disabled = false;
      btn.textContent = "Login";
    }
    if (cancelBtn) cancelBtn.disabled = false;
  }
}

async function openStockTimeline() {
  closeOverlay(adminDashboardSheet);

  adminStockSheet.innerHTML = `
    <h3>📦 ประวัติความเคลื่อนไหวสต๊อก</h3>
    <div class="loading">กำลังโหลด...</div>
  `;

  openOverlay(adminStockSheet);

  try {
    const logsRes = await fetchStockLogs();
    const logs = Array.isArray(logsRes?.data) ? logsRes.data : [];

    /* ================= GROUP ORDER OUT ================= */
    const orderMap = {};
    const singles = [];

    logs.forEach(l => {
  const time = l.timestamp ? new Date(l.timestamp) : new Date();

  // ✅ ใช้ orderId จริงจาก sheet (fallback เผื่อของเก่า)
  const orderRef = l.orderId || l.ref || null;

  if (l.type === "OUT" && orderRef) {
    if (!orderMap[orderRef]) {
      orderMap[orderRef] = {
        orderId: orderRef,
        time,
        by: l.by || "-",
        items: []
      };
    }

    orderMap[orderRef].items.push({
      productId: l.productId,
      qty: Math.abs(Number(l.qty || 0)),
      before: l.before,
      after: l.after
    });
  } else {
    singles.push({
      ...l,
      _time: time
    });
  }
});

    /* ================= BUILD TIMELINE ================= */
    const timeline = [];

    Object.values(orderMap).forEach(o => {
      timeline.push({
        kind: "ORDER",
        type: "OUT",
        orderId: o.orderId,
        time: o.time,
        by: o.by,
        items: o.items
      });
    });

    singles.forEach(l => {
      timeline.push({
        kind: "STOCK",
        type: l.type,
        productId: l.productId,
        qty: l.qty,
        before: l.before,
        after: l.after,
        time: l._time,
        by: l.by || "-"
      });
    });

    // 🕒 latest first (safe)
    timeline.sort((a, b) => b.time.getTime() - a.time.getTime());

    /* ================= RENDER ================= */
    adminStockSheet.innerHTML = `
      <h3>📦 ประวัติความเคลื่อนไหวสต๊อก</h3>

      <button class="btn btn-secondary"
        style="width:100%;margin-bottom:12px"
        onclick="finishAdminAction({ refresh:false })">
        ← กลับ
      </button>

      ${
        timeline.length
          ? timeline.map(t => {

              if (t.kind === "ORDER") {
                return `
                  <div class="card">
                    <div class="timeline-tag tag-out">
                      🧾 ขายออก (ออเดอร์ ${t.orderId})
                    </div>

                    ${t.items.map(i => `
                      <div style="font-size:14px;line-height:1.5">
                        ${i.productId} x ${i.qty}
                        ${
                          Number.isFinite(i.before)
                            ? `<span style="color:#888">
                                (${i.before} → ${i.after})
                              </span>`
                            : ""
                        }
                      </div>
                    `).join("")}

                    <div style="font-size:12px;color:#888;margin-top:6px">
                      ${t.time.toLocaleDateString("th-TH")}
                      ${t.time.toLocaleTimeString("th-TH")}
                      · โดย ${t.by}
                    </div>
                  </div>
                `;
              }

              const typeMap = {
                IN:     { text: "➕ รับสต๊อกเข้า", class: "tag-in" },
                CREATE: { text: "🆕 เพิ่มสินค้าใหม่", class: "tag-create" },
                ADJUST: { text: "✏️ ปรับสต๊อก", class: "tag-adjust" }
              };

              const cfg = typeMap[t.type] || { text: t.type, class: "" };

              return `
                <div class="card">
                  <div class="timeline-tag ${cfg.class}">
                    ${cfg.text}
                  </div>

                  <div style="font-size:14px">
                    ${t.productId}
                    ${
                      Number.isFinite(t.before)
                        ? ` (${t.before} → ${t.after})`
                        : ""
                    }
                  </div>

                  <div style="font-size:12px;color:#888;margin-top:6px">
                    ${t.time.toLocaleDateString("th-TH")}
                    ${t.time.toLocaleTimeString("th-TH")}
                    · โดย ${t.by}
                  </div>
                </div>
              `;
            }).join("")
          : `
            <div style="text-align:center;color:#888;margin-top:32px">
              ไม่มีข้อมูลประวัติสต๊อก
            </div>
          `
      }
    `;

  } catch (err) {
    console.error(err);

    adminStockSheet.innerHTML = `
      <h3>📦 ประวัติความเคลื่อนไหวสต๊อก</h3>
      <div style="text-align:center;color:#d93025;margin-top:32px">
        ไม่สามารถโหลดข้อมูลได้
      </div>
    `;
  }
}

  const reason = reasonInput.value.trim();

  // 🔍 validate
  if (!Number.isInteger(qty) || qty <= 0) {
    alert("จำนวนไม่ถูกต้อง");
    qtyInput.focus();
    return;
  }

  // 🔒 disable ปุ่มกันกดซ้ำ
  const buttons = adminStockActionSheet.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);

  try {
    const res = await adminStockIn(
      state.selectedProduct.productId,
      qty,
      reason
    );

    if (res.error) {
      throw new Error(res.error);
    }

    alert("รับสต๊อกเข้าแล้ว");

    // 🔄 refresh สินค้า
    await refreshProducts();

    // 🧹 reset input
    qtyInput.value = "";
    reasonInput.value = "";

    // ✅ ปิด Stock Action ผ่าน Overlay Manager
    closeOverlay(adminStockActionSheet);

    // ✅ กลับสู่หน้าแม่ของ admin แบบนิ่ง
    finishAdminAction({ refresh: true });

  } catch (err) {
    console.error(err);
    alert(err.message || "ไม่สามารถรับสต๊อกได้");
  } finally {
    // 🔓 เปิดปุ่มกลับทุกกรณี
    buttons.forEach(b => b.disabled = false);
  }
}


async function submitStockAdjust(){

    alert("จำนวนไม่ถูกต้อง");
    qtyInput.focus();

  // 🔒 disable ปุ่มกันกดซ้ำ
  const buttons = adminStockActionSheet.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);

  try {
    const res = await adminStockAdjust(
      state.selectedProduct.productId,
      newQty,
      reason
    );

      throw new Error(res.error);

  state.isSubmitting = true;
  state.ui.backdropLocked = true;

  try {
    // ================= STEP 1: CHECK STOCK =================
    showLoading('กำลังตรวจสอบสต๊อก...');

    if (!stockCheck.ok) {
      showToast(stockCheck.message, 'warning');
      throw new Error("STOCK_CHECK_FAILED");

    // ================= STEP 2: CREATE ORDER =================
    updateLoadingText('กำลังสร้างใบสั่งซื้อ...');

      throw new Error("Invalid order response");

    state.lastOrder = {
      orderId: res.data.orderId,
      items: JSON.parse(JSON.stringify(state.cart)),

 createdAt: new Date(),

 `;

// confirmSheet เปิดอยู่แล้ว ไม่ต้อง reopen

    clearCartStorage();

    renderBadge();
    
  // ❌ ห้าม auto reset หลังสร้าง order สำเร็จ
    
  } catch(err){

    showToast(
      err.message || 'เกิดข้อผิดพลาดในการสร้างใบสั่งซื้อ',

async function handleCompareImagesUpload(input){
  const files = Array.from(input.files || []);
  if (!files.length) return;

  // 🔒 guard
  if (!state.admin?.token) {
    showToast("กรุณา login ใหม่", "warning");
    return;
  }

  showLoading("กำลังอัปโหลดรูปเทียบสินค้า...");

  try {
    const urls = [];

    for (const file of files) {
      const url = await uploadProductImage(file);
      if (url) urls.push(url);
    }

   // ✅ STEP 8: merge เข้า state เดียว
   state.compareImagesDraft.push(...urls);

   // 🔄 re-render preview ผ่าน state (มีปุ่ม ❌)
   const wrap = document.getElementById("comparePreview");
   if (wrap) {
     wrap.innerHTML = state.compareImagesDraft.map((url, idx) => `
       <div style="position:relative">
         <img src="${url}"
              style="
                width:80px;
                height:80px;

           onclick="removeCompareImage(${idx})"

             width:20px;
             height:20px;
             border:none;
             border-radius:50%;
             background:#ff3b30;
             color:#fff;
             font-size:12px;
             cursor:pointer;
           "
         >×</button>
       </div>
     `).join("");
   }
  
    showToast("อัปโหลดรูปเทียบสำเร็จ", "success");

  } catch (err) {
    console.error(err);
    showToast("อัปโหลดรูปไม่สำเร็จ", "error");

async function uploadProductImage(file) {
  return new Promise((resolve, reject) => {
    // 🔒 guard token
    if (!state.admin || !state.admin.token) {
      reject("Missing admin token");
      return;
    }

    const reader = new FileReader();

    reader.onload = async () => {
      try {
        // 🔹 ตัด data:image/...;base64,
        const base64 = reader.result.split(",")[1];

        // ✅ ใช้ FormData
        const formData = new FormData();
        formData.append("action", "uploadProductImage"); // ✅ สำคัญ (ที่ขาดอยู่)
        formData.append("token", state.admin.token);
        formData.append("filename", file.name);
        formData.append("mimeType", file.type || "image/jpeg");
        formData.append("data", base64);

        const res = await fetch(API_URL, {
          method: "POST",
          body: formData
        });

        const json = await res.json();

        // 🔒 backend wrap data ไว้ใน data
        if (!json.success || !json.data || !json.data.imageUrl) {
          reject(json.error || json.message || "Upload failed");
          return;
        }

        // ✅ สำเร็จ
        resolve(json.data.imageUrl);

      } catch (err) {
        reject(err);
      }
    };

    reader.onerror = () => {
      reject("File read error");
    };

    reader.readAsDataURL(file);
  });
}

/* =========================================================
   🔤 THAI BAHT TEXT CONVERTER
========================================================= */
function numberToThaiText(num) {
  if (isNaN(num)) return "";

  const digit = ["ศูนย์", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า"];
  const position = ["", "สิบ", "ร้อย", "พัน", "หมื่น", "แสน", "ล้าน"];

  function convert(n) {
    let result = "";
    const str = parseInt(n, 10).toString();
    const len = str.length;

    for (let i = 0; i < len; i++) {
      const d = parseInt(str.charAt(i));
      const pos = len - i - 1;

      if (d === 0) continue;

      if (pos === 0 && d === 1 && len > 1) {
        result += "เอ็ด";
      } else if (pos === 1 && d === 2) {
        result += "ยี่";
      } else if (pos === 1 && d === 1) {
        result += "";
      } else {
        result += digit[d];
      }

      result += position[pos];
    }

    return result;
  }

  if (num === 0) return "ศูนย์บาทถ้วน";

  return convert(num) + "บาทถ้วน";
}

  ctx.fillStyle = "#f2f2f7";

  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "rgba(0,0,0,0.08)";
  ctx.shadowBlur = 20;

    ctx.quadraticCurveTo(x + w, y0, x + w, y0 + r);
    ctx.lineTo(x + w, y0 + h - r);
    ctx.quadraticCurveTo(x + w, y0 + h, x + w - r, y0 + h);
    ctx.lineTo(x + r, y0 + h);
    ctx.quadraticCurveTo(x, y0 + h, x, y0 + h - r);

ctx.font = `700 ${cfg.textSize + 4}px -apple-system`;
ctx.fillText("ร้านล้อพาณิชย์", cfg.padding, headerTopY);

ctx.fillText(

 );
 ctx.fillText(

 );
 ctx.fillText(

 );

/* ===== DOCUMENT META ===== */
const rightX = canvas.width - cfg.padding;

  ctx.textAlign = "right";

 ctx.fillText(`PO: ${po}`, rightX, headerTopY + cfg.lineHeight);
 const docDate = new Date(order.createdAt);

 );

  ctx.beginPath();

/* ================= ITEMS (GRID TABLE) ================= */

  y += rowHeight - 16;

/* ================= GLOBAL INPUT FOCUS FIX ================= */
function focusInput(el) {
  if (!el) return;

  setTimeout(() => {
    try {
      el.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    } catch (e) {
      el.scrollIntoView();
    }
  }, 200);
}

function saveAdminSession({ token, username, expiredAt }) {
  localStorage.setItem("admin_session", JSON.stringify({
    token,
    username,
    expiredAt
  }));
}

function loadAdminSession() {
  try {
    return JSON.parse(localStorage.getItem("admin_session"));
  } catch {
    return null;
  }
}

function clearAdminSession() {
  localStorage.removeItem("admin_session");
}

// ================= EMERGENCY UI UNLOCK =================
// ⚠️ DEV / ADMIN USE ONLY
window.forceUnlockUI = function(){
  console.warn('[forceUnlockUI] manual reset');

  // reset flags
  state.isSubmitting = false;
  state.ui.backdropLocked = false;
  state.ui.overlayCount =
    document.querySelectorAll(".sheet.show, .side-menu.show").length;
  // close all overlays
  document
    .querySelectorAll(".sheet.show, .side-menu.show")
    .forEach(el => el.classList.remove("show"));

  // hide loading overlay
  const overlay = document.getElementById("loading-overlay");
  if (overlay) overlay.classList.add("hidden");

  // hide backdrop
  if (backdrop) backdrop.style.display = "none";

  showToast("รีเซ็ตระบบเรียบร้อย", "info");
};

async function restoreAdminSessionIfValid() {
  const restored = loadAdminSession();
  if (!restored?.token || !restored?.expiredAt) return false;

  if (Date.now() > new Date(restored.expiredAt).getTime()) {
    clearAdminSession();
    return false;
  }

  try {
    // lightweight validate
    const res = await fetch(
      `${API_URL}?action=orders&token=${restored.token}`
    );
    const json = await res.json();

    if (json?.success === true) {
      state.admin.loggedIn = true;
      state.admin.user = restored.username;
      state.admin.token = restored.token;
      state.admin.expiredAt = restored.expiredAt;
      state.mode = "admin";
      return true;
    }
  } catch (e) {
    console.warn("restore admin failed");
  }

  clearAdminSession();
  return false;
}
  
/* ================= INIT APP (CLEAN / SAFE) ================= */
 /* ================= LIQUID HEADER SCROLL EFFECT ================= */
 let _lastScrollY = 0;
 let _lastScrollTime = performance.now(); // 🔴 NEW: velocity time base
 let _headerTicking = false;

 const VELOCITY_HIDE = 0.6;   // px per ms
 const VELOCITY_SHOW = -0.6;  // px per ms 
 const VELOCITY_DEADZONE = 0.05; // 🔴 NEW: jitter guard 
 
 function handleHeaderScroll(){
   const header = document.getElementById("appHeader");
   const bar    = document.getElementById("floatingBar");
   
   const currentY = Math.max(0, window.scrollY); // 🔴 FIX: clamp negative scroll (iOS bounce)
   const now = performance.now();                       // 🔴 NEW
   const delta = currentY - _lastScrollY;
   const deltaTime = now - _lastScrollTime || 16;      // 🔴 NEW
   const velocity = delta / deltaTime;                 // 🔴 NEW

  // 🔴 NEW: micro scroll noise guard
  if (Math.abs(delta) < 1) {
    _lastScrollY = currentY;
    _lastScrollTime = now;
    _headerTicking = false;
    return;
  }  
   
if (header){
    if (currentY > 10) {
      header.classList.add("scrolled");
    } else {
      header.classList.remove("scrolled");
    }
  }

  /* ================= FLOATING BAR SMART HIDE ================= */
  if (
   bar &&
   bar.classList.contains("show") &&
   state.ui.overlayCount === 0 // 🔴 CHANGED: disable momentum when overlay open
 ) {

    if (currentY <= 10) {
      // 📍 อยู่บนสุด → แสดงเสมอ
      bar.classList.remove("scroll-hide");
    }
    else if (velocity > VELOCITY_HIDE + VELOCITY_DEADZONE) {
      // ⬇️ scroll ลง
      bar.classList.add("scroll-hide");
    }
    else if (velocity < VELOCITY_SHOW - VELOCITY_DEADZONE) {
      // ⬆️ scroll ขึ้น
      bar.classList.remove("scroll-hide");
    }
  }

   _lastScrollY = currentY;
   _lastScrollTime = now; // 🔴 NEW
   _headerTicking = false;
 }

 window.addEventListener("scroll", () => {
   
   if (!_headerTicking) {
     window.requestAnimationFrame(handleHeaderScroll);
     _headerTicking = true;
   }
 });
  
(async () => {
  try {
    state.search = "";

    const restored = loadAdminSession();
    let adminRestored = false;

    if (
      restored &&
      restored.token &&
      restored.expiredAt &&
      Date.now() < new Date(restored.expiredAt).getTime()
    ) {
      try {
        // ✅ FIX: ใช้ POST ให้ตรง backend
        const form = new URLSearchParams();
        form.append("action", "orders");
        form.append("token", restored.token);

        const res = await fetch(API_URL, {
          method: "POST",
          body: form
        });

        const json = await res.json();

        if (json && json.success === true) {
          state.admin.loggedIn = true;
          state.admin.user = restored.username;
          state.admin.token = restored.token;
          state.admin.expiredAt = restored.expiredAt;

          state.mode = "admin";
          adminRestored = true;
        }
      } catch (err) {
        console.warn("Admin session validation failed", err);
      }
    }

    // ❌ invalid / expired
    if (!adminRestored) {
      clearAdminSession();
      state.mode = "viewer";
    }

    // ✅ RESTORE VIEWER STATE ก่อน render ทุกอย่าง
    loadCart();

    // ✅ ค่อยโหลด data หลังรู้ mode แล้ว
    await refreshProducts();

    // ✅ RENDER
    renderHeader();
    renderProducts();
    if (typeof renderBadge === "function") {
      renderBadge();
    }

  } catch (err) {
    console.error("[INIT ERROR]", err);
    showToast("ไม่สามารถโหลดข้อมูลเริ่มต้นได้", "error");
  } finally {
    safeHideLoading();
  }
})();
