<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stock Viewer</title>

<!-- ================= UI STYLE ================= -->
<style>
  :root {
   --shadow-card:    0 10px 30px rgba(0,0,0,.08);
   --shadow-control: 0 6px 16px rgba(0,0,0,.08);
   --shadow-image:   0 4px 12px rgba(0,0,0,.12);
   --shadow-float:   0 12px 36px rgba(0,0,0,.12);
 }
  
  html, body {
  margin: 0;
  padding: 0;

  width: 100%;
  max-width: 100%;
  overflow-x: hidden;   /* 🔴 ตัวนี้คือหัวใจ */

  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f2f2f7;
}
  header{
  padding:16px;
  font-size:22px;
  font-weight:500;

  /* 🔹 Visual */
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(18px) saturate(160%);
  border-bottom: 1px solid rgba(0,0,0,.06);

  /* 🔹 Position */
  position:sticky;
  top:0;
  z-index:10;

  /* 🔹 Layout (สำคัญ) */
  display:flex;
  justify-content:space-between;
  align-items:center;

  /* 🔴 FIX สำคัญ */
  min-height:56px;      /* กัน iOS / mobile ไม่ render ปุ่ม */
  box-sizing:border-box;
}

  .badge{
    background:#ff3b30;color:#fff;
    border-radius:12px;padding:2px 8px;
    font-size:12px;
  }
  .container{padding:16px;display:grid;gap:16px;}
  .card{
    background:#fff;border-radius:18px;
    padding:14px;cursor:pointer;
  }
  .name{
  font-weight:600;
  line-height:1.35;

  display:-webkit-box;
  -webkit-line-clamp:2;      /* จำกัด 2 บรรทัด */
  -webkit-box-orient:vertical;

  overflow:hidden;
  word-break:break-word;
}
  .price{color:#007aff;margin-top:4px;}
  .stock{font-size:14px;color:#666;}

  .backdrop{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.25);
  backdrop-filter: blur(2px);
  display: none;
  z-index: 100;
}

.sheet{
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;

  background: #fff;
  border-radius: 22px 22px 0 0;

  padding: 20px 20px 24px; /* เว้นล่างให้หายอึดอัด */

  /* ✅ CORE FIX */
  max-height: calc(100dvh - 40px);   /* ใช้ dvh แทน vh */
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;

  transform: translateY(100%);
  transition: transform .35s cubic-bezier(.22,.61,.36,1);

  z-index: 101;
}

.sheet.show{
  transform: translateY(0);
}

.sheet h3{
  margin:0 0 12px;
}



/* ================= BASE INPUT (NEUTRAL) ================= */
input,
select {
  width: 100%;
  box-sizing: border-box;
  outline: none;
  font-family: inherit;
  background: #fff;
}

input:focus,
select:focus {
  border-color: #007aff;
}

/* ================= STEP 3: FORM CONSISTENT ================= */

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.form-group label {
  font-size: 13px;
  color: #666;
}

/* ================= FORM INPUT (UNIFIED) ================= */

/* ทุก input / select ใน form + กัน iOS zoom */
.form-group input,
.form-group select {
  width: 100%;
  height: 44px;
  padding: 10px 12px;

  font-size: 16px;          /* 🔴 FIX iOS ZOOM */
  line-height: 1.2;

  border-radius: 12px;
  border: 1px solid #ddd;
  box-sizing: border-box;
  background: #fff;
  font-family: inherit;
}

/* number ต้องเหมือน text (iOS / Android) */
.form-group input[type="number"] {
  appearance: textfield;
  -moz-appearance: textfield;
}

/* focus state */
.form-group input:focus,
.form-group select:focus {
  border-color: #007aff;
  outline: none;
}

  /* ✅ เพิ่มตรงนี้ */
button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

 .btn-remove{
  padding:6px 12px;
  border-radius:10px;
  background:#ff3b30;
  color:#fff;
  border:none;

  font-size:13px;
  font-weight:600;
  line-height:1;

  cursor:pointer;
 }
  /* ✅ เพิ่มตรงนี้ */
.btn-remove:active {
  transform: scale(0.95);
}

/* ⚪ OUTLINE / CANCEL */
.btn-outline {
  background: #f2f2f7;
  color: #333;
  border: 1px solid #ddd;
}

/* interaction */
.btn-danger:active,
.btn-outline:active {
  transform: scale(0.97);
}
  
/* ================= BUTTON SYSTEM ================= */

.btn {
  padding: 12px;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  font-size: 15px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

/* Primary */
.btn-primary {
  background: #007aff;
  color: #fff;
}

/* Secondary (soft green) */
.btn-secondary {
  background: #34c759;
  color: #fff;
}

/* Outline (cancel / back) */
.btn-outline {
  background: #f2f2f7;
  color: #333;
  border: 1px solid #ddd;
}

/* Interaction */
.btn:active {
  transform: scale(0.97);
}

  .cart-item{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  padding:12px 0;
  border-bottom:1px dashed rgba(0,0,0,.08);
  }

 .cart-item > div:first-child {
   flex: 1;
   min-width: 0; /* 🔴 สำคัญมาก: ให้ text ถูกตัดได้ */
 }

 .cart-item > div:last-child {
   flex-shrink: 0;
   text-align: right;
 }

 .cart-item .price{
   margin-top:2px;
 }

 .cart-item-right{
   display:flex;
   align-items:center;   /* 🔴 หัวใจ: align กับราคา */
   gap:8px;
 }
 

  .total{
  font-size:18px;
  font-weight:700;
  text-align:right;
  margin-top:16px;
  padding-top:12px;
  border-top:1px solid rgba(0,0,0,.08);
  }

#cartSheet .btn-primary{
  margin-top:16px;
  margin-bottom:12px;
}

#cartSheet{
  padding-bottom: calc(env(safe-area-inset-bottom) + 28px);
}
  
  /* ===== Order Preview (Hidden) ===== */
  #orderPreview {
    width: 360px;
    padding: 16px;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: none;
  }
  #orderPreview h2 {
    margin: 0 0 8px;
  }
  #orderPreview .item {
    display:flex;
    justify-content:space-between;
    margin-bottom:6px;
    font-size:14px;
  }
  #orderPreview .footer {
    margin-top:12px;
    font-weight:700;
    text-align:right;
  }

/* ================= HEADER SEARCH (iOS-LIKE) ================= */

.search-wrap {
  display: flex;
  align-items: center;
  position: relative;
  max-width: calc(100% - 44px);
}

.search-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,.6);
  backdrop-filter: blur(10px);
  font-size: 18px;
  cursor: pointer;

  transition:
    transform .18s cubic-bezier(.25,.46,.45,.94),
    background .2s ease;
}

.search-btn:active {
  transform: scale(.92);
}

.search-input {
  width: 0;
  opacity: 0;
  margin-left: 8px;
  height: 40px;
  padding: 8px 12px;

  font-size: 16px;
  border-radius: 12px;
  border: 1px solid rgba(0,0,0,.12);

  background: rgba(255,255,255,.85);
  backdrop-filter: blur(14px);

  transform: translateX(-6px) scale(.96);
  pointer-events: none;

  transition:
    width .35s cubic-bezier(.22,.61,.36,1),
    opacity .18s ease,
    transform .35s cubic-bezier(.22,.61,.36,1);
}

/* 🔥 ACTIVE STATE */
.search-wrap.active .search-input {
  width: 100%;
  opacity: 1;
  transform: translateX(0) scale(1);
  pointer-events: auto;
}

/* 🔹 subtle focus glow (iOS feel) */
.search-input:focus {
  border-color: #007aff;
  box-shadow:
    0 0 0 3px rgba(0,122,255,.18);
  outline: none;
}


  /* ================= PRODUCT CARD (HORIZONTAL) ================= */
.product-card {
  display: flex;
  gap: 12px;
  background: #fff;
  border-radius: 16px;
  padding: 12px;
  box-shadow: var(--shadow-card);
  align-items: center;
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease;
}

.product-card .thumb {
  width: 80px;
  height: 80px;
  border-radius: 12px;
  object-fit: cover;
  background: #f0f0f0;
  flex-shrink: 0;
}

.product-card .info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.product-card .name {
  font-weight: 600;
  font-size: 16px;
}

.product-card .sku {
  font-size: 12px;
  color: #888;
}

.product-card .price {
  color: #007aff;
  font-weight: 600;
  margin-top: 2px;
}

.product-card .meta {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 13px;
  color: #555;
}

.product-card:active {
  transform: scale(0.97);
  box-shadow: var(--shadow-control);
}  

 .product-info-images {
   display: flex;
   gap: 8px;
   overflow-x: auto;
   margin: 12px 0;
 }

 .product-info-images img {
   height: 120px;
   border-radius: 12px;
   object-fit: cover;
 }

 .product-info-block {
   background: #f9f9fb;
   border-radius: 12px;
   padding: 12px;
   font-size: 14px;
 }
  
.sheet-product {
  min-height: 60dvh;   /* 🔴 ปรับได้: 65–80 */
}  

/* ===== Status Badge (Viewer) ===== */
.status {
  padding: 3px 10px;
  min-height: 22px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* พร้อมส่ง */
.status.ready {
  background: #e6f9f0;
  color: #1e9c6a;
}

/* อยู่ระหว่างจัดส่ง */
.status.shipping {
  background: #fff4e5;
  color: #e37400;
}

/* อยู่โกดังไทย */
.status.warehouse {
  background: #eef3ff;
  color: #3b6cff;
}

/* หมด */
.status.out {
  background: #fdecec;
  color: #d93025;
}


.admin-action {
  display: flex;
  gap: 12px;
  margin-top: 16px;
}

.btn-approve {
  flex: 1;
  background: #007aff;
  color: #fff;
}

.btn-reject {
  flex: 1;
  background: #ff3b30;
  color: #fff;
}

.btn-approve:active,
.btn-reject:active {
  transform: scale(0.97);
}

/* ================= SIDE ADMIN MENU ================= */
.side-menu {
  position: fixed;
  top: 0;
  right: 0;

  width: min(65vw, 260px);
   /* ✅ ลดลงอีกนิด กำลังพอดี */
  height: 100vh;

  background: #ffffff;
  box-shadow: -6px 0 20px rgba(0,0,0,.12);

  z-index: 102;
  padding: 16px;            /* ✅ ลด padding ให้ดูไม่อึดอัด */

  transform: translateX(100%);
  transition: transform .28s ease;
  will-change: transform;
}

.side-menu.show {
  transform: translateX(0);
}

/* ===== UI DETAILS ===== */
.side-menu h3 {
  margin-top: 0;
  margin-bottom: 16px;
}

.side-menu .menu-btn {
  width: 100%;
  margin-bottom: 12px;
}

.loading {
  text-align: center;
  padding: 32px 16px;
  color: #666;
  font-size: 14px;
}

.loading::after {
  content: "…";
  animation: dots 1.4s infinite;
}

@keyframes dots {
  0%   { content: ""; }
  33%  { content: "."; }
  66%  { content: ".."; }
  100% { content: "..."; }
}

.menu-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-group.danger {
  margin-top: 12px;
}

.btn-danger:active {
  transform: scale(0.97);
}

/* 🔒 iOS SAFARI ZOOM FIX */
input,
select,
textarea {
  font-size: 16px !important; /* 🔴 สำคัญที่สุด */
} 

/* ===== STOCK TIMELINE COLOR TAG ===== */
.timeline-tag {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
}

/* สีตามประเภท */
.tag-in {
  background: #e6f9f0;
  color: #1e9c6a;
}

.tag-out {
  background: #fdecec;
  color: #d93025;
}

.tag-create {
  background: #eef3ff;
  color: #3b6cff;
}

.tag-adjust {
  background: #fff4e5;
  color: #e37400;
}

.tag-cancel {
  background: #f1f1f1;
  color: #666;
}

/* ===== ADMIN LOGIN TWEAK ===== */
#adminLoginSheet {
  padding-bottom: calc(env(safe-area-inset-bottom) + 24px); /* 🔴 ยกขึ้นจากขอบ */
}

/* ===== PREMIUM INPUT STYLE ===== */
.form-group input,
#adminLoginSheet input {
  background: #f9f9fb;
  border: 1px solid #e5e5ea;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.04);
}

.form-group input:focus,
#adminLoginSheet input:focus {
  background: #fff;
  border-color: #007aff;
  box-shadow:
    0 0 0 2px rgba(0,122,255,.15),
    inset 0 1px 2px rgba(0,0,0,.04);
} 

/* ================= TOAST SYSTEM (GLOBAL FEEDBACK) ================= */

#toast-container {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 24px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 3000;

  display: flex;
  flex-direction: column;
  gap: 8px;

  pointer-events: none; /* 🔒 ไม่บัง interaction */
}

.toast {
  min-width: 260px;
  max-width: 90vw;
  padding: 12px 16px;

  border-radius: 14px;
  color: #fff;
  font-size: 14px;
  font-weight: 500;

  box-shadow: 0 8px 24px rgba(0,0,0,.18);

  animation: toast-slide-down .25s ease;
}

/* ===== Toast Variants ===== */
.toast.success { background: #34c759; }
.toast.error   { background: #ff3b30; }
.toast.warning { background: #ff9f0a; }
.toast.info    { background: #007aff; }

/* ===== Animation (namespaced) ===== */
@keyframes toast-slide-down {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hidden {
  display: none;
}

#loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

#loading-overlay.hidden {
  display: none !important;
}

.loading-box {
  background: #fff;
  padding: 20px 24px;
  border-radius: 12px;
  box-shadow: var(--shadow-float);
  text-align: center;
  min-width: 200px;
}

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid #ddd;
  border-top-color: #555;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 12px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

 /* ================= QTY INPUT (CART / ADD TO CART) ================= */

 /* wrapper เฉพาะช่องจำนวน */
 .qty-input {
   position: relative;
 }

 /* input number สำหรับจำนวน */
 .qty-input input[type="number"] {
   height: 52px;                    /* สูงขึ้น → ดูเป็น control */
   padding: 12px 44px;              /* เผื่อพื้นที่ icon */
   text-align: center;              /* จำนวนต้องอยู่กลาง */

   font-size: 18px;
   font-weight: 600;

   border-radius: 16px;
   border: 1px solid rgba(0,0,0,.08);

   background: rgba(255,255,255,.9);
   backdrop-filter: blur(6px);

   box-shadow:
     inset 0 1px 2px rgba(0,0,0,.05),
     var(--shadow-control);

   transition: box-shadow .2s ease, border-color .2s ease;
 }

 /* focus = glow */
 .qty-input input[type="number"]:focus {
   border-color: #007aff;
   box-shadow:
     0 0 0 3px rgba(0,122,255,.18),
     inset 0 1px 2px rgba(0,0,0,.05);
 }

 /* ซ่อน spin button เดิม */
 .qty-input input[type="number"]::-webkit-inner-spin-button,
 .qty-input input[type="number"]::-webkit-outer-spin-button {
   -webkit-appearance: none;
   margin: 0;
 }

 /* ================= QTY ACTION (BOTTOM SAFE) ================= */
.qty-action {
  margin-top: 16px;
  padding-bottom: calc(env(safe-area-inset-bottom) + 12px);
}

/* 🔒 จำกัดเฉพาะหน้าแก้ไขสินค้า (Admin) */
#adminProductEditSheet img {
  width: 100%;
  max-width: 120px;        /* 🔴 ลดลงอย่างมาก */
  height: auto;
  aspect-ratio: 1 / 1;

  object-fit: cover;
  border-radius: 12px;

  margin: 8px auto 12px;   /* กินพื้นที่น้อย */
  display: block;

  box-shadow: var(--shadow-image);
}

/* ลดช่องว่างรอบ ๆ รูป */
#adminProductEditSheet {
  padding-top: 12px;
}

/* ให้ form ชิดขึ้น */
#adminProductEditSheet .form-group {
  margin-bottom: 10px;
}

/* ================= IMAGE FULLSCREEN VIEWER ================= */
#imageViewerSheet img {
  max-width: 100%;
  max-height: 100dvh;
  object-fit: contain;
}

#imageViewerSheet .close-btn {
  position: fixed;
  top: calc(env(safe-area-inset-top) + 14px);
  right: 14px;

  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;

  background: rgba(0,0,0,.6);
  color: #fff;
  font-size: 24px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
  z-index: 5;
}

/* =================================================
   📦 PRODUCT SHEET – SHARED UI CLASSES
   ใช้แทน inline-style ใน renderProductSheet
   (ไม่กระทบ logic / flow)
   ================================================= */

/* ❌ ปุ่มปิด Sheet (มุมขวาบน) */
.sheet-close-btn {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 12px);
  right: 12px;

  width: 36px;
  height: 36px;

  border-radius: 50%;
  border: none;

  background: rgba(0,0,0,0.55);
  color: #fff;

  font-size: 22px;
  font-weight: 500;
  line-height: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.sheet-close-btn:active {
  transform: scale(0.95);
}

/* 🏷️ ชื่อสินค้าใน Product Sheet */
.product-title {
  margin-top: 4px;
}

/* 🖼️ รูปสินค้า (มาตรฐาน) */
.product-image {
  width: 100%;
  aspect-ratio: 1 / 1;

  object-fit: cover;

  border-radius: 14px;
  margin: 12px 0;

  background: #f0f0f0;
}

/* 📝 หมายเหตุสินค้า (Note) */
.product-note {
  margin-top: 10px;
  padding: 10px 12px;

  font-size: 14px;
  line-height: 1.45;
  color: #555;

  background: #f9f9fb;
  border-radius: 12px;
  border: 1px dashed rgba(0,0,0,.12);
}

/* 🔹 Action Zone (ปุ่มล่างสุด) */
.product-action-zone {
  margin-top: 20px;
  padding-bottom: calc(env(safe-area-inset-bottom) + 12px);
}

/* 🔧 ข้อความโหมดแอดมิน */
.product-admin-hint {
  margin-top: 16px;
  color: #888;
  font-size: 14px;
}

 
</style>
</head>
<body>

<!-- 🔴 HEADER (Mode-Based Controlled) -->
<header id="appHeader"></header>


<div id="app" class="container"></div>

<!-- ✅ GLOBAL BACKDROP (มีตัวเดียวพอ) -->
<div id="globalBackdrop" class="backdrop" onclick="handleBackdropClick()"></div>

<!-- ================= VIEWER SHEETS ================= -->
<div id="productSheet" class="sheet sheet-product"></div>
<div id="qtySheet" class="sheet"></div>
<div id="cartSheet" class="sheet"></div>
<div id="confirmSheet" class="sheet"></div>
<div id="stockSheet" class="sheet"></div>  

<!-- 🖼️ IMAGE VIEWER (FULLSCREEN) -->
 <div id="imageViewerSheet" class="sheet"
   style="
     background:#000;
     padding:0;
     display:flex;
     align-items:center;
     justify-content:center;
     cursor: zoom-out;
   ">
</div>

<!-- ================= ADMIN SHEETS ================= -->
<div id="adminLoginSheet" class="sheet"></div>
<div id="adminDashboardSheet" class="sheet"></div>
<div id="adminOrderSheet" class="sheet"></div>
<div id="adminStockSheet" class="sheet"></div>

/* ================= CART STORAGE (VIEWER ONLY) ================= */

const CART_KEY = "luopanich_cart";

function saveCart() {
  try {
    localStorage.setItem(CART_KEY, JSON.stringify(state.cart));
  } catch (e) {
    console.warn("saveCart failed", e);
  }
}

function loadCart() {
  try {
    const raw = localStorage.getItem(CART_KEY);
    if (!raw) return;

    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) {
      state.cart = parsed;
    }
  } catch (e) {
    console.warn("loadCart failed", e);
  }
}

function clearCartStorage() {

  /* ===== Feedback & Loading Utilities ===== */
function updateLoadingText(message){
  const text = document.getElementById("loading-text");
  if (text) {
    text.textContent = message;
  }
}

function showToast(message, type = 'info', timeout = 2500) {
  const container = document.getElementById('toast-container');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;

  container.appendChild(toast);

  // 🔒 limit toast count (optional but pro)
  if (container.children.length > 3) {
    container.removeChild(container.firstChild);
  }

  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, timeout);
}

// ---------- Central loading timer ----------
let _loadingTimer = null;
let _loadingShownAt = 0;
const MIN_LOADING_MS = 350; // กันกระพริบ

function showLoading(message, timeoutMs = 60000) {
  const overlay = document.getElementById("loading-overlay");
  const text = document.getElementById("loading-text");
  if (!overlay || !text) return;

  text.textContent = message;
  overlay.classList.remove("hidden");

  // บังคับ render
  overlay.offsetHeight;

  _loadingShownAt = Date.now();

  state.isSubmitting = true;
  state.ui.backdropLocked = true;
  if (backdrop) backdrop.style.display = "block";

  clearTimeout(_loadingTimer);
  _loadingTimer = setTimeout(() => {
    console.warn("[showLoading] auto-hide after timeout");
    safeHideLoading(true);
    showToast("การเชื่อมต่อล่าช้า ระบบยกเลิกแล้ว", "warning", 1800);
  }, timeoutMs);
}

/* ================= SAFE HIDE LOADING (SINGLE SOURCE OF TRUTH) ================= */
/**
 * ❗ IMPORTANT
 * - ต้องมี safeHideLoading แค่ตัวเดียวในระบบ
 * - ตัวนี้คือเวอร์ชันเดียวที่อนุญาตให้ใช้
 */

function safeHideLoading(fromTimeout = false) {
  const overlay = document.getElementById("loading-overlay");

  const elapsed = Date.now() - (_loadingShownAt || 0);
  const delay = Math.max(0, MIN_LOADING_MS - elapsed);

  setTimeout(() => {
    try {
      if (overlay) overlay.classList.add("hidden");

      // 🔥 หัวใจ: เคลียร์ timer ของ showLoading
      if (_loadingTimer) {
        clearTimeout(_loadingTimer);
        _loadingTimer = null;
      }

      state.isSubmitting = false;
      state.ui.backdropLocked = false;

      if (state.ui.overlayCount === 0 && backdrop) {
        backdrop.style.display = "none";
      }

      console.log(
        "[safeHideLoading] loading closed",
        fromTimeout ? "(timeout)" : ""
      );

    } catch (e) {
      console.error("[safeHideLoading] failed", e);
    }
  }, delay);
}


// ---------- fetchWithTimeout ----------
async function fetchWithTimeout(input, init = {}, ms = 30000) {
  const controller = new AbortController();
  const signal = controller.signal;
  const id = setTimeout(() => controller.abort(), ms);

  try {
    const res = await fetch(input, { ...init, signal });

    // 🔒 เช็ค HTTP status ชัดเจน
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`HTTP ${res.status}: ${text}`);
    }

    return res;

  } catch (err) {
    if (err.name === "AbortError") {
      throw new Error("การเชื่อมต่อช้าเกินไป กรุณาลองใหม่อีกครั้ง");
    }
    throw err;
  } finally {
    clearTimeout(id);
  }
}

const API_URL="https://script.google.com/macros/s/AKfycbzwRXCVX01CSHievxI7NKITMpf2JCYy6VPAZJ9QiGXRf7dgJ4qDHAGqkFnbInUhQNegMw/exec";

const fetchProducts = async () => {
  const res = await fetchWithTimeout(
   `${API_URL}?action=products`,
   {},
   15000
 );
  const json = await res.json();

  // 🔒 enforce standard response
  if (!json || json.success !== true || !Array.isArray(json.data)) {
    console.error("fetchProducts invalid response:", json);
    return []; // ✅ คืน array เสมอ
  }

  return json.data;
};

function sortProducts(products) {
  if (!Array.isArray(products)) return [];

  return products.sort((a, b) =>
    String(a.productId || "").localeCompare(
      String(b.productId || ""),
      'th',
      {
        numeric: true,
        sensitivity: 'base'
      }
    )
  );
}
  
async function refreshProducts() {
  const list = await fetchProducts();

  state.products = sortProducts(list); // ✅ เพิ่มบรรทัดเดียว
  renderProducts();
}

async function createOrder() {
  const total = state.cart.reduce(
   (s,i)=> s + Number(i.price) * Number(i.qty),
   0
 );

  const form = new URLSearchParams();
  form.append("action", "createOrder");
  form.append("items", JSON.stringify(state.cart));
  form.append("total", total);

  // ใช้ fetchWithTimeout เพื่อป้องกัน request แขวน
  const res = await fetchWithTimeout(API_URL, {
    method: "POST",
    body: form
  }, 15000);

  // 🔴 FIX: เช็ค HTTP status ก่อน
  if (!res.ok) {
    const text = await res.text();
    throw new Error(
      `CreateOrder HTTP ${res.status}: ${text}`
    );
  }

  const json = await res.json();

  // 🔴 FIX: validate response shape
  if (!json || json.success !== true || !json.data?.orderId) {
    throw new Error("Invalid createOrder response");
  }

  return json;
}

function openOverlay(el){
  if (!el || el.classList.contains("show")) return;

  el.classList.add("show");
  state.ui.overlayCount++;

  backdrop.style.display = "block";
}

function closeOverlay(el){
  if (!el || !el.classList.contains("show")) return;

  el.classList.remove("show");
  state.ui.overlayCount = Math.max(0, state.ui.overlayCount - 1);

  if (state.ui.overlayCount === 0 && !state.ui.backdropLocked) {
    backdrop.style.display = "none";
  }
}

/* ================= STOCK CHECK ================= */
async function checkStockBeforeSubmit() {
  const latestProducts = await fetchProducts();

  for (const item of state.cart) {
    const product = latestProducts.find(
      p => p.productId === item.productId
    );

    if (!product) {
      return { ok:false, message:`ไม่พบสินค้า ${item.name}` };
    }

    if (Number(product.stock) < Number(item.qty)) {
      return {
        ok:false,
        message:`${item.name} คงเหลือ ${product.stock} ชิ้น (คุณเลือก ${item.qty})`
      };
    }
  }

  return { ok:true };
}

function renderProducts(){
  const app = document.getElementById("app");

  const escapeHTML = (str="") =>
    str.replace(/</g,"&lt;").replace(/>/g,"&gt;");
  
  // 🔒 GUARD สำคัญที่สุด
  if (!Array.isArray(state.products)) {
    console.error("renderProducts: products is not array", state.products);
    app.innerHTML = `
      <div style="
        text-align:center;
        color:#d93025;
        margin-top:40px;
        font-size:15px;
      ">
        ไม่สามารถโหลดรายการสินค้าได้
      </div>
    `;
    return;
  }

  app.innerHTML = "";
  let found = false;

  state.products.forEach(p => {
    const stockNum = Number(p.stock);

    // ❌ ไม่แสดงสินค้าที่ปิดขาย (viewer เท่านั้น)
    if (state.mode === "viewer" && !p.active) return;

    // 🔍 SEARCH FILTER (ชื่อ + รหัส)
    if (state.search) {
      const text = (p.name + p.productId).toLowerCase();
      if (!text.includes(String(state.search).toLowerCase())) return;
    }

   // 🔍 STATUS FILTER (Viewer only, use resolved status)
   const resolvedStatus =
     stockNum <= 0 ? "out" : (p.status || "ready");

   if (
     state.mode === "viewer" &&
     state.viewerFilter &&
     state.viewerFilter.status !== "all"
   ) {
     if (resolvedStatus !== state.viewerFilter.status) return;
   }
    
/* ================= STATUS LOGIC ================= */
const statusMap = {
  ready:     "พร้อมส่ง",
  shipping:  "อยู่ระหว่างจัดส่ง",
  warehouse: "อยู่โกดังไทย",
  out:       "หมด"
};

const statusKey = resolvedStatus;
let statusClass = statusKey;
let statusText  = statusMap[statusKey] || "พร้อมส่ง";

    /* ================= CARD ================= */
    const card = document.createElement("div");
    card.className = "product-card";

    card.onclick = () => {
      if (state.mode === "admin") {
        openAdminProductAction(p);
      } else {
        openProduct(p);
      }
    };

    card.innerHTML = `
      <img class="thumb"
        src="${p.image ? p.image : "about:blank"}"
        alt="${p.name}"
        onerror="this.style.display='none'">

      <div class="info">
        <div class="name">${escapeHTML(p.name)}</div>
        <div class="sku">รหัส: ${escapeHTML(p.productId)}</div>
        <div class="price">ราคา: ฿${Number(p.price).toLocaleString()}</div>

        <div class="meta">
          <span class="qty">จำนวน: ${p.stock}</span>
          <span class="status ${statusClass}">
            ${statusText}
          </span>
        </div>
      </div>
    `;

    app.appendChild(card);
    found = true;
  });

  // ❌ ไม่พบสินค้า
  if (!found) {
    app.innerHTML = `
      <div style="
        text-align:center;
        color:#888;
        margin-top:40px;
        font-size:15px;
      ">
        ไม่พบสินค้าที่ค้นหา
      </div>
    `;
  }
}

async function handleAdminLogin(btn){
  // 🔒 กันกดซ้ำ
  if (state.isSubmitting) return;

  // 🔒 force global rate limit (scope-safe)
  if (typeof window.isLoginRateLimited === "function") {
    if (window.isLoginRateLimited()) {
      alert("พยายามเข้าสู่ระบบบ่อยเกินไป กรุณารอสักครู่");
      return;
    }
  }

  const userInput = document.getElementById("adminUser");
  const passInput = document.getElementById("adminPass");
  const cancelBtn = document.getElementById("adminCancelBtn");

  const username = userInput.value.trim();
  const password = passInput.value;

  if (!username || !password) {
    alert("กรุณากรอก Username และ Password");
    return;
  }

  // ================= UX START =================
  state.isSubmitting = true;

  if (btn) {
    btn.disabled = true;
    btn.textContent = "กำลังเข้าสู่ระบบ...";
  }
  if (cancelBtn) cancelBtn.disabled = true;

  showLoading("กำลังเข้าสู่ระบบแอดมิน...");
  // ================= UX END ===================

  try {
    // 🔐 CALL BACKEND LOGIN
    const form = new URLSearchParams();
    form.append("action", "adminLogin");
    form.append("username", username);
    form.append("password", password);

    const res = await fetch(API_URL, {
      method: "POST",
      body: form
    });

    const json = await res.json();

    if (!json.success || !json.token) {
      throw new Error(json.error || json.message || "Login failed");
    }

    // ✅ SAVE SESSION (STATE)
    state.admin.loggedIn = true;
    state.admin.user = json.username;
    state.admin.token = json.token;
    state.admin.expiredAt = json.expiredAt;

    // ✅ SAVE SESSION (PERSIST)
    saveAdminSession(json);

    // 🧹 CLOSE LOGIN SHEET
    closeOverlay(adminLoginSheet);

    // 🔓 reset lock เผื่อมีค้าง
    state.ui.backdropLocked = false;

    // 🚀 ENTER ADMIN MODE
    enterAdmin();

  } catch (err) {
    console.error(err);
    alert(err.message || "ไม่สามารถเข้าสู่ระบบได้");

  } finally {
    // ================= CLEANUP =================
    safeHideLoading();
    state.isSubmitting = false;

    if (btn) {
      btn.disabled = false;
      btn.textContent = "Login";
    }
    if (cancelBtn) cancelBtn.disabled = false;
  }
}

      }
    `;
  } catch (err) {
    console.error(err);

    // 🔴 ถ้าเป็น session error → ออกทันที
    if (
      err.message?.includes("Session") ||
      err.message?.includes("token")

  }

async function openStockTimeline() {
  closeOverlay(adminDashboardSheet);

  adminStockSheet.innerHTML = `
    <h3>📦 ประวัติความเคลื่อนไหวสต๊อก</h3>
    <div class="loading">กำลังโหลด...</div>
  `;

  openOverlay(adminStockSheet);

  try {
    const logsRes = await fetchStockLogs();
    const logs = Array.isArray(logsRes?.data) ? logsRes.data : [];

    /* ================= GROUP ORDER OUT ================= */
    const orderMap = {};
    const singles = [];

    logs.forEach(l => {
  const time = l.timestamp ? new Date(l.timestamp) : new Date();

  // ✅ ใช้ orderId จริงจาก sheet (fallback เผื่อของเก่า)
  const orderRef = l.orderId || l.ref || null;

  if (l.type === "OUT" && orderRef) {
    if (!orderMap[orderRef]) {
      orderMap[orderRef] = {
        orderId: orderRef,
        time,
        by: l.by || "-",
        items: []
      };
    }

    orderMap[orderRef].items.push({
      productId: l.productId,
      qty: Math.abs(Number(l.qty || 0)),
      before: l.before,
      after: l.after
    });
  } else {
    singles.push({
      ...l,
      _time: time
    });
  }
});

    /* ================= BUILD TIMELINE ================= */
    const timeline = [];

    Object.values(orderMap).forEach(o => {
      timeline.push({
        kind: "ORDER",
        type: "OUT",
        orderId: o.orderId,
        time: o.time,
        by: o.by,
        items: o.items
      });
    });

    singles.forEach(l => {
      timeline.push({
        kind: "STOCK",
        type: l.type,
        productId: l.productId,
        qty: l.qty,
        before: l.before,
        after: l.after,
        time: l._time,
        by: l.by || "-"
      });
    });

    // 🕒 latest first (safe)
    timeline.sort((a, b) => b.time.getTime() - a.time.getTime());

    /* ================= RENDER ================= */
    adminStockSheet.innerHTML = `
      <h3>📦 ประวัติความเคลื่อนไหวสต๊อก</h3>

      <button class="btn btn-secondary"
        style="width:100%;margin-bottom:12px"
        onclick="finishAdminAction({ refresh:false })">
        ← กลับ
      </button>

      ${
        timeline.length
          ? timeline.map(t => {

              if (t.kind === "ORDER") {
                return `
                  <div class="card">
                    <div class="timeline-tag tag-out">
                      🧾 ขายออก (ออเดอร์ ${t.orderId})
                    </div>

                    ${t.items.map(i => `
                      <div style="font-size:14px;line-height:1.5">
                        ${i.productId} x ${i.qty}
                        ${
                          Number.isFinite(i.before)
                            ? `<span style="color:#888">
                                (${i.before} → ${i.after})
                              </span>`
                            : ""
                        }
                      </div>
                    `).join("")}

                    <div style="font-size:12px;color:#888;margin-top:6px">
                      ${t.time.toLocaleDateString("th-TH")}
                      ${t.time.toLocaleTimeString("th-TH")}
                      · โดย ${t.by}
                    </div>
                  </div>
                `;
              }

              const typeMap = {
                IN:     { text: "➕ รับสต๊อกเข้า", class: "tag-in" },
                CREATE: { text: "🆕 เพิ่มสินค้าใหม่", class: "tag-create" },
                ADJUST: { text: "✏️ ปรับสต๊อก", class: "tag-adjust" }
              };

              const cfg = typeMap[t.type] || { text: t.type, class: "" };

              return `
                <div class="card">
                  <div class="timeline-tag ${cfg.class}">
                    ${cfg.text}
                  </div>

                  <div style="font-size:14px">
                    ${t.productId}
                    ${
                      Number.isFinite(t.before)
                        ? ` (${t.before} → ${t.after})`
                        : ""
                    }
                  </div>

                  <div style="font-size:12px;color:#888;margin-top:6px">
                    ${t.time.toLocaleDateString("th-TH")}
                    ${t.time.toLocaleTimeString("th-TH")}
                    · โดย ${t.by}
                  </div>
                </div>
              `;
            }).join("")
          : `
            <div style="text-align:center;color:#888;margin-top:32px">
              ไม่มีข้อมูลประวัติสต๊อก
            </div>
          `
      }
    `;

  } catch (err) {
    console.error(err);

    adminStockSheet.innerHTML = `
      <h3>📦 ประวัติความเคลื่อนไหวสต๊อก</h3>
      <div style="text-align:center;color:#d93025;margin-top:32px">
        ไม่สามารถโหลดข้อมูลได้
      </div>
    `;
  }
}

async function submitStockIn(){
  // 🔒 guard
  if (state.mode !== "admin" || !state.selectedProduct) {
    alert("Unauthorized");
    return;
  }

  const qtyInput    = document.getElementById("stockQty");
  const reasonInput = document.getElementById("stockReason");

  const qty    = Number(qtyInput.value);
  const reason = reasonInput.value.trim();

  // 🔍 validate
  if (!Number.isInteger(qty) || qty <= 0) {
    alert("จำนวนไม่ถูกต้อง");
    qtyInput.focus();
    return;
  }

  // 🔒 disable ปุ่มกันกดซ้ำ
  const buttons = adminStockActionSheet.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);

  try {
    const res = await adminStockIn(
      state.selectedProduct.productId,
      qty,
      reason
    );

    if (res.error) {
      throw new Error(res.error);
    }

    alert("รับสต๊อกเข้าแล้ว");

    // 🔄 refresh สินค้า
    await refreshProducts();

    // 🧹 reset input
    qtyInput.value = "";
    reasonInput.value = "";

    // ✅ ปิด Stock Action ผ่าน Overlay Manager
    closeOverlay(adminStockActionSheet);

    // ✅ กลับสู่หน้าแม่ของ admin แบบนิ่ง
    finishAdminAction({ refresh: true });

  } catch (err) {
    console.error(err);
    alert(err.message || "ไม่สามารถรับสต๊อกได้");
  } finally {
    // 🔓 เปิดปุ่มกลับทุกกรณี
    buttons.forEach(b => b.disabled = false);
  }
}

  reader.readAsDataURL(file);

async function submitOrder(){
  // ❌ ห้ามใช้ state.loading เป็น guard
  if (state.isSubmitting || state.cart.length === 0) return;

  state.isSubmitting = true;
  state.ui.backdropLocked = true;

  try {
    // ================= STEP 1: CHECK STOCK =================
    showLoading('กำลังตรวจสอบสต๊อก...');
    const stockCheck = await checkStockBeforeSubmit();

    if (!stockCheck.ok) {
      showToast(stockCheck.message, 'warning');
      throw new Error("STOCK_CHECK_FAILED");
    }

    // ================= STEP 2: CREATE ORDER =================
    updateLoadingText('กำลังสร้างใบสั่งซื้อ...');
    const res = await createOrder();

    if (!res || res.success !== true || !res.data?.orderId) {
      throw new Error("Invalid order response");
    }

    // ================= SUCCESS =================
    state.lastOrder = {
      orderId: res.data.orderId,
      items: JSON.parse(JSON.stringify(state.cart)),
      total: state.cart.reduce(
        (s,i)=> s + Number(i.price) * Number(i.qty),
        0
      ),
 createdAt: new Date(),
 poNumber: state.poNumber || ""
    };

    showToast('สร้างใบสั่งซื้อเรียบร้อยแล้ว', 'success');
    showToast("กดปุ่มเพื่อดาวน์โหลดใบสั่งซื้อ", "info", 3000);

 // เปิด confirmSheet ใหม่พร้อมปุ่มดาวน์โหลด
 confirmSheet.innerHTML = `
   <h3>สร้างใบสั่งซื้อสำเร็จ</h3>
   <div style="margin-top:12px">
     เลขที่ใบสั่งซื้อ: ${res.data.orderId}
   </div>
   <button class="btn btn-primary"
     style="margin-top:16px"
     onclick="exportOrderPrint()">
     ดาวน์โหลดใบสั่งซื้อ
   </button>
 `;

 openOverlay(confirmSheet);

    state.cart = [];
    clearCartStorage();
    state.poNumber = "";
    renderBadge();

    setTimeout(() => {
      if (!state.ui.backdropLocked) {
        hardResetUI();
      }
    }, 300);

  } catch(err){
    console.error(err);
    showToast(
      err.message || 'เกิดข้อผิดพลาดในการสร้างใบสั่งซื้อ',
      'error'
    );
  } finally {
    safeHideLoading();
    state.isSubmitting = false;
    // 🔒 ปลด lock เฉพาะเมื่อไม่มี sheet เปิดอยู่ (กัน race condition)
    if (state.ui.overlayCount === 0) {
      state.ui.backdropLocked = false;
    }
  }
}

async function uploadProductImage(file) {
  return new Promise((resolve, reject) => {
    // 🔒 guard token
    if (!state.admin || !state.admin.token) {
      reject("Missing admin token");
      return;
    }

    const reader = new FileReader();

    reader.onload = async () => {
      try {
        // 🔹 ตัด data:image/...;base64,
        const base64 = reader.result.split(",")[1];

        // ✅ ใช้ FormData
        const formData = new FormData();
        formData.append("action", "uploadProductImage"); // ✅ สำคัญ (ที่ขาดอยู่)
        formData.append("token", state.admin.token);
        formData.append("filename", file.name);
        formData.append("mimeType", file.type || "image/jpeg");
        formData.append("data", base64);

        const res = await fetch(API_URL, {
          method: "POST",
          body: formData
        });

        const json = await res.json();

        // 🔒 backend wrap data ไว้ใน data
        if (!json.success || !json.data || !json.data.imageUrl) {
          reject(json.error || json.message || "Upload failed");
          return;
        }

        // ✅ สำเร็จ
        resolve(json.data.imageUrl);

      } catch (err) {
        reject(err);
      }
    };

    reader.onerror = () => {
      reject("File read error");
    };

    reader.readAsDataURL(file);
  });
}

function exportOrderPNG() {
  const order = state.lastOrder;
  if (!order) return;

  /* ================= A4 CONFIG (FIXED) ================= */
  const cfg = {
    width: 794,          // A4 width @96dpi
    height: 1123,        // 🔥 A4 height fixed
    padding: 64,
    titleSize: 32,
    textSize: 18,
    lineHeight: 34
  };
  /* ================= CANVAS SIZE ================= */
  const items = Array.isArray(order.items) ? order.items : [];

  const po = order.poNumber
    ? String(order.poNumber)
    : "-";

  const customerName = "บริษัท ออร์เดอร์พลัส 88 จำกัด";
  const customerTaxId = "0195566000907";

  const canvas = document.createElement("canvas");
  canvas.width = cfg.width;
  canvas.height = cfg.height;  // 🔥 FIXED A4

  const ctx = canvas.getContext("2d");

  /* ================= BACKGROUND ================= */
  ctx.fillStyle = "#f2f2f7";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  /* ================= CARD ================= */
  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "rgba(0,0,0,0.08)";
  ctx.shadowBlur = 20;
  ctx.shadowOffsetY = 6;

  ctx.beginPath();

  if (typeof ctx.roundRect === "function") {
    ctx.roundRect(8, 8, canvas.width - 16, canvas.height - 16, 18);
  } else {
    const x = 8;
    const y0 = 8;
    const w = canvas.width - 16;
    const h = canvas.height - 16;
    const r = 18;

    ctx.moveTo(x + r, y0);
    ctx.lineTo(x + w - r, y0);
    ctx.quadraticCurveTo(x + w, y0, x + w, y0 + r);
    ctx.lineTo(x + w, y0 + h - r);
    ctx.quadraticCurveTo(x + w, y0 + h, x + w - r, y0 + h);
    ctx.lineTo(x + r, y0 + h);
    ctx.quadraticCurveTo(x, y0 + h, x, y0 + h - r);
    ctx.lineTo(x, y0 + r);
    ctx.quadraticCurveTo(x, y0, x + r, y0);

/* ===== DOCUMENT META ===== */

  ctx.textAlign = "right";

 ctx.fillText(`PO: ${po}`, rightX, headerTopY + cfg.lineHeight);

 );

y = headerTopY + cfg.lineHeight * 11;


  /* ===== DIVIDER ===== */

  ctx.beginPath();
  ctx.moveTo(cfg.padding, y);
  ctx.lineTo(canvas.width - cfg.padding, y);
  ctx.stroke();
  y += cfg.lineHeight;

/* ================= ITEMS (GRID TABLE) ================= */

  const rowHeight = 42;

    no: cfg.padding,

  y += rowHeight - 16;

function focusInput(el) {
  if (!el) return;

  setTimeout(() => {
    try {
      el.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    } catch (e) {
      el.scrollIntoView();
    }
  }, 200);
}

function saveAdminSession({ token, username, expiredAt }) {
  localStorage.setItem("admin_session", JSON.stringify({
    token,
    username,
    expiredAt
  }));
}

function loadAdminSession() {
  try {
    return JSON.parse(localStorage.getItem("admin_session"));
  } catch {
    return null;
  }
}

function clearAdminSession() {
  localStorage.removeItem("admin_session");
}

window.forceUnlockUI = function(){
  console.warn('[forceUnlockUI] manual reset');

  // reset flags
  state.isSubmitting = false;
  state.ui.backdropLocked = false;
  state.ui.overlayCount =
    document.querySelectorAll(".sheet.show, .side-menu.show").length;
  // close all overlays
  document
    .querySelectorAll(".sheet.show, .side-menu.show")
    .forEach(el => el.classList.remove("show"));

  // hide loading overlay
  const overlay = document.getElementById("loading-overlay");
  if (overlay) overlay.classList.add("hidden");

  // hide backdrop
  if (backdrop) backdrop.style.display = "none";

  showToast("รีเซ็ตระบบเรียบร้อย", "info");
};

async function restoreAdminSessionIfValid() {
  const restored = loadAdminSession();
  if (!restored?.token || !restored?.expiredAt) return false;

  if (Date.now() > new Date(restored.expiredAt).getTime()) {
    clearAdminSession();
    return false;
  }

  try {
    // lightweight validate
    const res = await fetch(
      `${API_URL}?action=orders&token=${restored.token}`
    );
    const json = await res.json();

    if (json?.success === true) {
      state.admin.loggedIn = true;
      state.admin.user = restored.username;
      state.admin.token = restored.token;
      state.admin.expiredAt = restored.expiredAt;
      state.mode = "admin";
      return true;
    }
  } catch (e) {
    console.warn("restore admin failed");
  }

  clearAdminSession();
  return false;
}
  
/* ================= INIT APP (CLEAN / SAFE) ================= */
(async () => {
  try {
    state.search = "";

    const restored = loadAdminSession();
    let adminRestored = false;

    if (
      restored &&
      restored.token &&
      restored.expiredAt &&
      Date.now() < new Date(restored.expiredAt).getTime()
    ) {
      try {
        // ✅ FIX: ใช้ POST ให้ตรง backend
        const form = new URLSearchParams();
        form.append("action", "orders");
        form.append("token", restored.token);

        const res = await fetch(API_URL, {
          method: "POST",
          body: form
        });

        const json = await res.json();

        if (json && json.success === true) {
          state.admin.loggedIn = true;
          state.admin.user = restored.username;
          state.admin.token = restored.token;
          state.admin.expiredAt = restored.expiredAt;

          state.mode = "admin";
          adminRestored = true;
        }
      } catch (err) {
        console.warn("Admin session validation failed", err);
      }
    }

    // ❌ invalid / expired
    if (!adminRestored) {
      clearAdminSession();
      state.mode = "viewer";
    }

    // ✅ RESTORE VIEWER STATE ก่อน render ทุกอย่าง
    loadCart();

    // ✅ ค่อยโหลด data หลังรู้ mode แล้ว
    await refreshProducts();

    // ✅ RENDER
    renderHeader();
    renderProducts();
    if (typeof renderBadge === "function") {
      renderBadge();
    }

  } catch (err) {
    console.error("[INIT ERROR]", err);
    showToast("ไม่สามารถโหลดข้อมูลเริ่มต้นได้", "error");
  } finally {
    safeHideLoading();
  }
})();
